hooks:
  # Each hook runs its commands in order from the repository root and stops at
  # the first failure. The commands check the whole working tree, not only the
  # staged files, and change nothing; `deno task fix` formats and fixes lint.
  pre-commit:
    - deno fmt --check
    - deno lint
  pre-push:
    # The full gate, the same command CI runs.
    - deno task test:all
