hooks:
  pre-commit:
    # Format code with deno fmt
    - id: deno-fmt
      name: deno fmt
      run: deno-fmt
      glob: "*.{ts,js,json,md}"
      pass_filenames: true

    # Lint code with deno lint
    - id: deno-lint
      name: deno lint
      run: deno-lint
      glob: "*.{ts,js}"
      pass_filenames: true

    # Fail on a standard-module embed that was not regenerated
    - id: modules-check
      name: modules check
      run: deno task modules:check
      pass_filenames: false

  pre-push:
    # Run the full gate before pushing, the same command CI runs; the built-in
    # `deno-test` is a bare `deno test -A`, which is not this project's gate
    - id: test
      name: test
      run: deno task test:all
      pass_filenames: false
