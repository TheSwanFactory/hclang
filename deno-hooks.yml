# Deno Hooks configuration.
#
# Each hook is a list of shell commands, run in order, with `set -e` so the
# first failure stops the commit or push. The installer inlines them into
# `.git/hooks/`, so the generated scripts resolve nothing at run time.
# Regenerate after editing with `deno task setup`.

hooks:
  pre-commit:
    # Formatting is checked rather than applied: a mutating hook would edit
    # files after they were staged, so the commit would keep the unformatted
    # content while the tree looked clean.
    - deno fmt --check
    - deno lint

  pre-push:
    - deno task test:all
