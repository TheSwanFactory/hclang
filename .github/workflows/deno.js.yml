# This workflow will do a clean installation of Deno dependencies, cache/restore them, build the source code and run tests across different versions of Deno

name: Deno CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish to JSR and attach hcweb.html to a release"
        type: boolean
        default: false
      publish_extension:
        description: "Publish the VS Code extension to the Marketplace"
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
      packages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno ci
      - name: Install Chromium for artifact tests
        run: deno run -A npm:playwright@1.62.0 install --with-deps chromium
      - run: deno task build
      - run: deno task test:all
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v5
        with:
          name: hcweb-candidate
          path: web/dist/hcweb.html
          if-no-files-found: error
      - name: Validate hcweb package
        working-directory: web
        run: deno publish --dry-run
      - name: Detect release
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.release }}
        run: |
          current_version=$(jq -r '.version' deno.json)
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=$MANUAL_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=$(git show "$BEFORE_SHA:deno.json" | jq -r '.version')
          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect extension release
        id: extension
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish_extension }}
        run: |
          manifest=vscode-extension/package.json
          current_version=$(jq -r '.version' "$manifest")
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=$MANUAL_PUBLISH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manifest absent from the previous commit is a first publish.
          previous_version=$(git show "$BEFORE_SHA:$manifest" 2>/dev/null | jq -r '.version' || true)
          if [ -n "$previous_version" ] && [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JSR
        id: deno-publish
        if: steps.version.outputs.changed == 'true'
        run: deno task publish
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
      - name: Build hcweb.html from the published package
        if: steps.version.outputs.changed == 'true'
        run: deno task build:web:release ${{ steps.version.outputs.version }}
      - name: Verify the released artifact
        if: steps.version.outputs.changed == 'true'
        working-directory: web
        run: deno task test:artifact
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        if: steps.version.outputs.changed == 'true'
        with:
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          artifacts: web/dist/hcweb.html,web/dist/hcweb.html.sha256
          artifactErrorsFailBuild: true
      - name: Use Node 22 for the extension publisher
        if: steps.extension.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Publish the VS Code extension
        if: steps.extension.outputs.changed == 'true'
        run: deno task vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
