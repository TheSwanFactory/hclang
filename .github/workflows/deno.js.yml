# Build and test every distribution; publish version bumps from trusted branches.

name: Deno CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish JSR, npm CLI, and the hcweb release artifact"
        type: boolean
        default: false
      publish_extension:
        description: "Publish the VS Code extension to the Marketplace"
        type: boolean
        default: false

jobs:
  # contents: write belongs only to this job. It pushes `style: deno fmt` onto
  # a same-repo pull request branch. Forks get a read-only token, and the
  # default branch is never a push target; both fail `deno fmt --check`.
  # scripts/ci-format.ts is the policy. A format commit whose tip is already
  # that bot commit is checked rather than pushed, so a token that does
  # retrigger workflows cannot loop. The workflow token does not retrigger, so
  # the build job records the checks on the commit this job pushes.
  format:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.apply.outputs.pushed }}
      sha: ${{ steps.apply.outputs.sha }}

    steps:
      - name: Checkout the pull request head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Checkout the event ref
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Deno 2.9.8
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Format and push, or fail the format check
        id: apply
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci-format.sh

  build:
    needs: format
    permissions:
      contents: read
      # Record this run on the format commit. The token push does not start one.
      checks: write

    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Deno 2.9.8
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      # The format job pushed deno fmt of the PR head. This checkout is the
      # merge commit from before that push, so format it too before the suite.
      - name: Format the checkout before building
        if: needs.format.outputs.pushed == 'true'
        run: deno fmt
      - name: Use Node 24 for the supported npm runtime floor
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate HC source bundle before dependency resolution
        run: deno task bundle:embed
      - run: deno ci
      - name: Install Chromium for artifact tests
        run: deno run -A npm:playwright@1.65.1 install --with-deps chromium
      - run: deno task build
      - run: deno lint
      - run: deno task check
      - run: deno task test:all
      - name: Upload candidate web artifact
        uses: actions/upload-artifact@v7
        with:
          name: hcweb-candidate
          path: web/dist/hcweb.html
          if-no-files-found: error
      - name: Upload tested npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: hclang-npm-candidate
          path: dist/hclang-*.tgz
          if-no-files-found: error
      - name: Check the coverage floor
        run: deno task coverage:check
      # When the format job pushed, this checkout was reformatted in place
      # above, so the tree is intentionally dirty with exactly that diff.
      - name: Validate hclang package
        working-directory: lib
        run: deno publish --dry-run ${{ needs.format.outputs.pushed == 'true' && '--allow-dirty' || '' }}
      - name: Validate hcweb package
        working-directory: web
        run: deno publish --dry-run ${{ needs.format.outputs.pushed == 'true' && '--allow-dirty' || '' }}
      - name: Detect release
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.release }}
        run: |
          current_version=$(jq -r '.version' deno.json)
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=$MANUAL_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=$(git show "$BEFORE_SHA:deno.json" | jq -r '.version')
          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect extension release
        id: extension
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish_extension }}
        run: |
          manifest=vscode-extension/package.json
          current_version=$(jq -r '.version' "$manifest")
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=$MANUAL_PUBLISH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manifest absent from the previous commit is a first publish.
          previous_version=$(git show "$BEFORE_SHA:$manifest" 2>/dev/null | jq -r '.version' || true)
          if [ -n "$previous_version" ] && [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node 22 for the extension publisher
        if: steps.extension.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish the VS Code extension
        if: steps.extension.outputs.changed == 'true'
        run: deno task vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Record this run on the format commit
        if: always() && needs.format.outputs.pushed == 'true'
        env:
          FORMAT_SHA: ${{ needs.format.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) conclusion=success ;;
            cancelled) conclusion=cancelled ;;
            *) conclusion=failure ;;
          esac
          details="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          summary="The format job pushed this commit with the workflow token. That push does not start another workflow run, so this run formatted the pull request checkout with deno fmt and recorded the result here."
          post_check() {
            jq -n \
              --arg name "$1" \
              --arg sha "$FORMAT_SHA" \
              --arg conclusion "$2" \
              --arg details "$details" \
              --arg title "$3" \
              --arg summary "$summary" \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:$conclusion, details_url:$details, output:{title:$title, summary:$summary}}' |
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/check-runs" --input -
          }
          post_check format success "Formatting pushed"
          post_check build "$conclusion" "Tested the formatted tree"

  release:
    name: Publish release
    needs: build
    if: needs.build.outputs.release == 'true'
    environment: npm-publish
    permissions:
      contents: write
      packages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted release source
        uses: actions/checkout@v7
      - name: Use Deno 2.9.8
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Use Node 24 for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Generate HC source bundle before dependency resolution
        run: deno task bundle:embed
      - run: deno ci
      - name: Download tested npm artifact
        uses: actions/download-artifact@v7
        with:
          name: hclang-npm-candidate
          path: dist
      - name: Publish missing JSR packages
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jsr_exists() {
            curl --fail --silent --output /dev/null \
              "https://jsr.io/$1/${VERSION}_meta.json"
          }

          if jsr_exists "@swanfactory/hclang"; then
            echo "@swanfactory/hclang@$VERSION already published"
          else
            deno task publish:lib
          fi

          if jsr_exists "@swanfactory/hcweb"; then
            echo "@swanfactory/hcweb@$VERSION already published"
          else
            deno task publish:web
          fi

          jsr_exists "@swanfactory/hclang"
          jsr_exists "@swanfactory/hcweb"
      - name: Publish missing npm package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm_version() {
            npm view "hclang@$VERSION" version --json 2>/dev/null | tr -d '"' || true
          }

          archive="./dist/hclang-$VERSION.tgz"
          test -f "$archive"
          published=$(npm_version)
          if [ "$published" = "$VERSION" ]; then
            echo "hclang@$VERSION already published"
          else
            deno task publish:npm "$archive"
          fi

          # The registry can take minutes to serve a new version: v0.17.1 was
          # still invisible after a minute, failing a publish that succeeded.
          for attempt in {1..30}; do
            published=$(npm_version)
            [ "$published" = "$VERSION" ] && break
            echo "Waiting for hclang@$VERSION to propagate ($attempt/30)"
            sleep 10
          done
          test "$published" = "$VERSION"
      - name: Install Chromium for released artifact tests
        run: deno run -A npm:playwright@1.65.1 install --with-deps chromium
      - name: Build hcweb.html from the published package
        run: deno task build:web:release ${{ needs.build.outputs.version }}
      - name: Verify the released artifact
        working-directory: web
        run: deno task test:artifact
      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: web/dist/hcweb.html,web/dist/hcweb.html.sha256
          artifactErrorsFailBuild: true
      - name: Upload the tested release for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  pages:
    name: Deploy and verify playground
    needs: [build, release]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy the release artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Generate HC source bundle before dependency resolution
        run: deno task bundle:embed
      - run: deno ci
      - name: Install Chromium
        run: deno run -A npm:playwright@1.65.1 install --with-deps chromium
      - name: Verify the live release and evaluate HC
        working-directory: web
        run: deno task test:production
        env:
          HCWEB_URL: ${{ steps.deployment.outputs.page_url }}
          HCWEB_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          HCWEB_EXPECTED_COMMIT: ${{ github.sha }}
