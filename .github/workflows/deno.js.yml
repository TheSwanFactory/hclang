# This workflow will do a clean installation of Deno dependencies, cache/restore them, build the source code and run tests across different versions of Deno

name: Deno CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    permissions:
      contents: write
      packages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno ci
      - run: deno task build
      - run: deno task test:all
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          tag: release-${{ github.sha }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
      - name: Publish to JSR on push to master
        id: deno-publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: deno task publish
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
