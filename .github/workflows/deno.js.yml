# Build and test every distribution; publish version bumps from trusted branches.

name: Deno CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish JSR, npm CLI, and the hcweb release artifact"
        type: boolean
        default: false
      publish_extension:
        description: "Publish the VS Code extension to the Marketplace"
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Use Node 24 for the supported npm runtime floor
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: deno ci
      - name: Install Chromium for artifact tests
        run: deno run -A npm:playwright@1.62.0 install --with-deps chromium
      - run: deno task build
      - run: deno task test:all
      - name: Upload candidate web artifact
        uses: actions/upload-artifact@v7
        with:
          name: hcweb-candidate
          path: web/dist/hcweb.html
          if-no-files-found: error
      - name: Upload tested npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: hclang-npm-candidate
          path: dist/hclang-*.tgz
          if-no-files-found: error
      - name: Validate hcweb package
        working-directory: web
        run: deno publish --dry-run
      - name: Detect release
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.release }}
        run: |
          current_version=$(jq -r '.version' deno.json)
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=$MANUAL_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=$(git show "$BEFORE_SHA:deno.json" | jq -r '.version')
          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect extension release
        id: extension
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish_extension }}
        run: |
          manifest=vscode-extension/package.json
          current_version=$(jq -r '.version' "$manifest")
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=$MANUAL_PUBLISH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manifest absent from the previous commit is a first publish.
          previous_version=$(git show "$BEFORE_SHA:$manifest" 2>/dev/null | jq -r '.version' || true)
          if [ -n "$previous_version" ] && [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node 22 for the extension publisher
        if: steps.extension.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Publish the VS Code extension
        if: steps.extension.outputs.changed == 'true'
        run: deno task vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  release:
    name: Publish release
    needs: build
    if: needs.build.outputs.release == 'true'
    environment: npm-publish
    permissions:
      contents: write
      packages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted release source
        uses: actions/checkout@v7
      - name: Use Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Use Node 24 for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: deno ci
      - name: Download tested npm artifact
        uses: actions/download-artifact@v7
        with:
          name: hclang-npm-candidate
          path: dist
      - name: Publish missing JSR packages
        env:
          DENO_AUTH_TOKEN: ${{ secrets.DENO_AUTH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jsr_exists() {
            curl --fail --silent --output /dev/null \
              "https://jsr.io/$1/${VERSION}_meta.json"
          }

          if jsr_exists "@swanfactory/hclang"; then
            echo "@swanfactory/hclang@$VERSION already published"
          else
            deno task publish:lib
          fi

          if jsr_exists "@swanfactory/hcweb"; then
            echo "@swanfactory/hcweb@$VERSION already published"
          else
            deno task publish:web
          fi

          jsr_exists "@swanfactory/hclang"
          jsr_exists "@swanfactory/hcweb"
      - name: Publish missing npm package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          published=$(npm view "hclang@$VERSION" version --json 2>/dev/null | tr -d '"' || true)
          if [ "$published" = "$VERSION" ]; then
            echo "hclang@$VERSION already published"
          else
            deno task publish:npm "dist/hclang-$VERSION.tgz"
          fi
          test "$(npm view "hclang@$VERSION" version --json | tr -d '"')" = "$VERSION"
      - name: Install Chromium for released artifact tests
        run: deno run -A npm:playwright@1.62.0 install --with-deps chromium
      - name: Build hcweb.html from the published package
        run: deno task build:web:release ${{ needs.build.outputs.version }}
      - name: Verify the released artifact
        working-directory: web
        run: deno task test:artifact
      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: web/dist/hcweb.html,web/dist/hcweb.html.sha256
          artifactErrorsFailBuild: true
